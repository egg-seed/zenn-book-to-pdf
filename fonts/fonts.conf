<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  PDF を作るときだけ使う fontconfig の設定。
  Chromium（Skia）は OTF/CFF のフォントやカラー絵文字を Type 3 フォントとして PDF に入れるため、
  mise run setup-fonts で fonts/ttf/ に用意した TrueType のフォントだけを使わせる。
  システムのフォントと設定は読まない（環境によって使われるフォントが変わらないように）。

  変換ツールは、fonts/ttf/manifest.json のフォントがそろっていれば、このファイルを自動で使う（Linux だけ）。
-->
<fontconfig>
  <!-- このファイルのある場所を基準にした ttf/ -->
  <dir prefix="relative">ttf</dir>
  <cachedir prefix="xdg">zenn-book-to-pdf/fontconfig</cachedir>

  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Noto Serif JP</family><family>Noto Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Noto Sans JP</family><family>Noto Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>UDEV Gothic</family><family>Liberation Mono</family><family>Noto Sans JP</family><family>Noto Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>emoji</family>
    <prefer><family>Noto Emoji</family></prefer>
  </alias>

  <!-- sans-serif は Noto Sans JP を先頭にする -->
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Noto Sans JP</string></edit>
  </match>
  <!-- どのフォントにもない文字は、Noto Sans JP、Noto Emoji、DejaVu Sans の順に探す -->
  <match target="pattern">
    <edit name="family" mode="append_last" binding="weak">
      <string>Noto Sans JP</string>
      <string>Noto Emoji</string>
      <string>DejaVu Sans</string>
    </edit>
  </match>

  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
  </match>
</fontconfig>
