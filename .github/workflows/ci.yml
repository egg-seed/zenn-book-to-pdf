name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup mise
        uses: jdx/mise-action@v2

      - name: Install toolchain
        run: mise install

      - name: Get pnpm store path
        id: pnpm-store
        run: echo "path=$(mise exec -- pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Show tool versions
        run: |
          mise --version
          mise exec -- node --version
          mise exec -- pnpm --version
          mise exec -- pnpm config get manage-package-manager-versions
          mise exec -- pnpm store path

      - name: Install dependencies
        run: mise run install

      - name: Install browser for Puppeteer
        run: mise exec -- pnpm exec puppeteer browsers install chrome

      - name: Run quality gate
        run: mise run ci
